<!-- Design Uniformity app icon. 64x64 tile, 16px corner radius, diagonal gradient accent -> accent-2,
     one white glyph drawn on the inner 36x36 (x/y 14..50), filled shapes, rounded 2.5px corners,
     depth by opacity steps (.7 / .85 / 1), never by extra colours. Swap the two stop colours for the app's accent family. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- glyph: replace this -->
  <rect x="14" y="14" width="36" height="36" rx="6" fill="#fff" opacity=".85"/>
</svg>
